# 1. Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    server_name belagestaostudio.com.br www.belagestaostudio.com.br bellagestaostudio.com.br www.bellagestaostudio.com.br;
    return 301 https://$host$request_uri;
}

# 2. Servidor Seguro HTTPS (Porta 443 -> Node.js porta 3002)
server {
    listen 443 ssl http2;
    server_name belagestaostudio.com.br www.belagestaostudio.com.br bellagestaostudio.com.br www.bellagestaostudio.com.br;

    # Certificados Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/belagestaostudio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belagestaostudio.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabecalhos de Seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Aplicacao BellaGestao Studio (Node.js porta 3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Microservico WhatsApp Daemon (Porta 3006)
    location /api/whatsapp-daemon/ {
        proxy_pass http://127.0.0.1:3006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
